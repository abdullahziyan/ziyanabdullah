<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziyan Abdullah | Official Portfolio</title>
  
  <!-- Exact Fonts matching the original layout -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 22, 0.85);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold-primary: #d4af37;
      --gold-light: #f7e7ce;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --text-white: #ffffff;
      --text-muted: #a0a0ab;
      --heart-color: #e74c3c;
      --whatsapp-color: #25d366;
      --instagram-color: #e1306c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px 40px 20px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(0, 0, 0, 0.8) 0%, transparent 50%);
      background-attachment: fixed;
    }

    /* TOP NAVBAR */
    nav {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 0;
    }

    .brand-logo {
      font-family: 'Alex Brush', cursive;
      font-size: 2.4rem;
      color: var(--gold-light);
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      color: #ccc;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      transition: color 0.3s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--gold-primary);
    }

    .admin-access-btn {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 10px 22px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      z-index: 10;
    }

    .admin-access-btn:hover {
      background: var(--gold-gradient);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* CONTAINER */
    .container {
      width: 100%;
      max-width: 1000px;
    }

    /* HERO SECTION */
    .hero-section {
      text-align: center;
      padding: 70px 20px 50px 20px;
      position: relative;
    }

    .hero-tag {
      font-size: 0.75rem;
      letter-spacing: 6px;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero-name {
      font-family: 'Playfair Display', serif;
      font-size: 4.2rem;
      font-weight: 400;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      line-height: 1.1;
    }

    .hero-signature-style {
      font-family: 'Alex Brush', cursive;
      font-size: 3.5rem;
      color: var(--gold-light);
      margin-top: -15px;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .feather-divider {
      color: var(--gold-primary);
      font-size: 1.2rem;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .hero-quote {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: #e0e0e0;
      margin-bottom: 10px;
    }

    .hero-author {
      font-family: 'Alex Brush', cursive;
      font-size: 1.8rem;
      color: var(--gold-light);
    }

    /* SECTION TITLE STYLING */
    .section-header {
      margin-top: 50px;
      margin-bottom: 30px;
      position: relative;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--text-white);
      font-weight: 400;
    }

    .section-title-divider {
      width: 50px;
      height: 1px;
      background: var(--gold-primary);
      margin-top: 8px;
    }

    /* ABOUT SECTION */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 60px;
    }

    .about-text-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 35px;
      backdrop-filter: blur(10px);
    }

    .about-text-card p {
      font-size: 0.9rem;
      line-height: 1.8;
      color: #bbbbbf;
      margin-bottom: 20px;
    }

    .read-more-btn {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 10px 22px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
    }

    .read-more-btn:hover {
      background: var(--gold-gradient);
      color: #000;
      font-weight: 600;
    }

    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 25px;
      backdrop-filter: blur(10px);
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-icon {
      color: var(--gold-primary);
      font-size: 1.5rem;
      width: 30px;
      text-align: center;
    }

    .stat-number {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--text-white);
      font-weight: 600;
    }

    .stat-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .quote-box-card {
      grid-column: span 2;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .quote-box-card p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-style: italic;
      color: #e5e5e8;
      margin-bottom: 15px;
    }

    /* POETRY GRID */
    .poetry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .poetry-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.4s ease;
      position: relative;
    }

    .poetry-card:hover {
      border-color: rgba(212, 175, 55, 0.6);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .poetry-card-type {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 12px;
    }

    .poetry-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--gold-light);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .poetry-card p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      color: #a5a5ad;
      line-height: 1.6;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .poetry-card img {
      width: 100%;
      height: 180
